    ApiProblemResponse:
      description: RFC 9457 problem details with stable GeoPulse extensions
      required:
      - code
      - errorId
      - requestId
      type: object
      properties:
        type:
          format: uri
          type: string
        title:
          type: string
        status:
          format: int32
          type: integer
        detail:
          type: string
        instance:
          format: uri
          type: string
        code:
          description: Stable machine-readable error code
          type: string
          allOf:
          - $ref: "#/components/schemas/ApiErrorCode"
          example: EXPORT_NOT_FOUND
        errorId:
          description: Unique identifier for this error
          type: string
        requestId:
          description: Request correlation identifier
          type: string
        parameters:
          description: "Error-code specific parameters, used to format the detail"
          type: object
          additionalProperties: {}
        violations:
          description: "Validation failures, when applicable"
          type: array
          items:
            $ref: "#/components/schemas/ApiViolation"
      additionalProperties: true
    ApiTokenResponse:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        userId:
          $ref: "#/components/schemas/UUID"
        userEmail:
          type: string
        name:
          type: string
        preview:
          type: string
        createdAt:
          $ref: "#/components/schemas/Instant"
        expiresAt:
          $ref: "#/components/schemas/Instant"
        revokedAt:
          $ref: "#/components/schemas/Instant"
        revokedBy:
          $ref: "#/components/schemas/UUID"
        lastUsedAt:
          $ref: "#/components/schemas/Instant"
        lastUsedIp:
          type: string
        status:
          $ref: "#/components/schemas/ApiTokenStatus"
    ApiTokenStatus:
      enum:
      - ACTIVE
      - EXPIRED
      - REVOKED
      type: string
    ApiViolation:
      type: object
      properties:
        field:
          description: Invalid request field
          type: string
        in:
          description: Request location containing the field
          type: string
        code:
          description: Stable machine-readable validation code
          type: string
          allOf:
          - $ref: "#/components/schemas/ApiViolationCode"
        parameters:
          description: Primitive values used to format the validation message
          type: object
          additionalProperties: {}
        detail:
          description: Localizable validation message
          type: object
          allOf:
          - $ref: "#/components/schemas/MessageDescriptor"
    ApiViolationCode:
      enum:
      - ASSERT_FALSE
      - ASSERT_TRUE
      - DECIMAL_MAX
      - DECIMAL_MIN
      - DIGITS
      - EMAIL
      - FUTURE
      - FUTURE_OR_PRESENT
      - MAX
      - MIN
      - NEGATIVE
      - NEGATIVE_OR_ZERO
      - NOT_BLANK
      - NOT_EMPTY
      - NOT_NULL
      - "NULL"
      - PAST
      - PAST_OR_PRESENT
      - PATTERN
      - POSITIVE
      - POSITIVE_OR_ZERO
      - SIZE
      - VALID_AREA_BOUNDS
      - INVALID_VALUE
      type: string
    ApplyNormalizationRulesRequest:
      type: object
      properties:
        applyToGeocoding:
          type: boolean
          example: true
        applyToFavorites:
          type: boolean
          example: true
        scopeValid:
          type: boolean
    AppriseExternalRoutingMode:
      enum:
