  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "A user API token or a session access token, sent as `Authorization:\
        \ Bearer <token>`."
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: "A user API token, sent as `X-API-Key: <token>`. Create one under\
        \ Profile → Security → API tokens."
    gpsSourceBasic:
      type: http
      scheme: basic
      description: "Username and password of a GPS source (OwnTracks, GPSLogger, Colota)."
    gpsSourceToken:
      type: http
      scheme: bearer
      description: "Token of a GPS source (Overland, Traccar, Home Assistant, Dawarich),\
        \ sent as `Authorization: Bearer <token>`."
    gpsSourceQueryKey:
      type: apiKey
      in: query
      name: api_key
      description: "Token of a Dawarich GPS source, sent as the `api_key` query parameter."
    shareLinkToken:
      type: http
      scheme: bearer
      description: "Short-lived access token of a share link, from `POST /api/v1/public/share-links/{linkId}/access-tokens`."
tags:
- name: Sessions
  description: "Sign in with email and password to get an access token and a refresh\
    \ token, renew them, and check which sign-in methods the server offers. Scripts\
    \ and long-running integrations should use an API token instead of signing in\
    \ with a password; see [API Tokens](https://geopulse.cc/docs/api/api-tokens)."
- name: OIDC Sign-in
  description: "Sign in with an OpenID Connect provider and link or unlink provider\
    \ identities on an existing account. Login starts with an authorization request\
    \ that returns the provider URL; the provider redirects back to GeoPulse, which\
    \ completes the flow through the callback endpoint."
- name: Mobile Sign-in
  description: "Sign a mobile app in without typing a password on the device. A signed-in\
    \ user creates a short-lived one-time code, and the mobile app exchanges that\
    \ code for its own session."
- name: Registration
  description: "Create new accounts, either through open registration (when enabled\
    \ by the administrator) or through an invitation link created by an administrator."
- name: API Tokens
  description: "Create and manage personal API tokens. A token acts as the user who\
    \ created it and is sent with `X-API-Key: <token>` or `Authorization: Bearer <token>`.\
    \ The token secret is returned only once, when the token is created. See [API\
    \ Tokens](https://geopulse.cc/docs/api/api-tokens)."
- name: GPS Tracker Ingest
  description: "Endpoints that GPS tracking apps send location updates to: OwnTracks,\
    \ Overland, Traccar, GPSLogger, Colota, Home Assistant, and Dawarich-compatible\
    \ clients. They do not use GeoPulse sessions or API tokens; each request authenticates\
    \ with the credentials of a GPS source configured under **GPS Sources** (HTTP\
    \ Basic or a bearer token, depending on the app). Responses use the format each\
    \ app expects."
- name: GPS Points
  description: "Read, correct, export, and delete the raw GPS points that every other\
    \ feature is built from. Points arrive from GPS tracker apps, the GeoPulse mobile\
    \ app, or file imports. Editing or deleting points updates the affected part of\
    \ the timeline automatically."
- name: GPS Sources
  description: "Configure where GPS points come from. A GPS source holds the credentials\
    \ a tracker app uses to send data, an optional device filter, and filtering of\
    \ inaccurate or duplicate points. Telemetry mappings control how extra fields\
    \ sent by a tracker, such as battery level, are labeled and shown."
- name: Import
  description: "Import location history from GPX, GeoJSON, CSV, OwnTracks, and Google\
    \ Timeline files, or from a GeoPulse export. Imports run as background jobs: upload\
    \ a file, then poll the import job until it finishes."
- name: Export
  description: "Export your data. Full exports run as background jobs: create a job,\
    \ poll its status, then download the result. Single trips and stays can be downloaded\
    \ directly as GPX."
- name: Timeline
  description: "The timeline is generated from GPS points and consists of **stays**\
    \ (time spent at one place), **trips** (movement between stays, with a detected\
    \ movement type), and **data gaps** (periods without GPS data). Use these endpoints\
    \ to read the timeline for a time range, regenerate it after changing settings,\
    \ and compare it with friends' timelines. All timestamps are ISO-8601 instants\
    \ in UTC."
- name: Timeline Corrections
  description: "Manual fixes for the generated timeline: set the movement type of\
    \ a trip, split a trip where a stop was missed, or turn a data gap into a stay.\
    \ Corrections are stored as overrides and survive timeline regeneration; each\
    \ can be undone."
- name: Timeline Labels
  description: "Label a time range of the timeline, for example a vacation or a business\
    \ trip. Labels may overlap; the overlap check lists conflicts before a label is\
    \ saved. Labels are also created by OwnTracks tags, and a label can be turned\
    \ into a trip."
- name: Places
  description: "Details about a single place on the timeline: its name, statistics,\
    \ and visits. A place is either a favorite (`type=favorite`) or a reverse-geocoded\
    \ location (`type=geocoding`)."
- name: Favorites
  description: "Favorite places and areas you name yourself. Stays inside a favorite\
    \ use its name instead of the reverse-geocoded address. Adding, deleting, or moving\
    \ a favorite starts a timeline regeneration in the background so existing stays\
    \ pick up the change."
- name: Geocoding
  description: "Manage reverse-geocoding results (address, city, and country resolved\
    \ for stay locations). Correct names, re-resolve locations with a different provider,\
    \ and define normalization rules that rename cities or countries consistently."
- name: Notes
  description: "Notes attached to a time and place on the timeline. Notes are stored\
    \ in GeoPulse or, when the Memos integration is enabled, in the user's Memos server."
- name: Statistics
  description: "Movement statistics (distance, time moving, average speed, top places,\
    \ frequent routes, and distance charts) for a custom range, the last 7 days, or\
    \ the last 30 days."
- name: Digests
  description: "Monthly and yearly summaries (\"Rewind\") with highlights, milestones,\
    \ comparisons with the previous period, heatmaps, and a PDF version."
- name: Journey Insights
  description: "Long-term insights across all data: countries and cities visited,\
    \ distance traveled, time patterns, weather, and earned achievements."
- name: Location Analytics
  description: "Browse and search the countries, cities, and places you have visited,\
    \ with visit history and CSV exports for each."
- name: Coverage
  description: "Coverage shows which areas of the map you have explored, as a grid\
    \ of cells calculated from GPS points. Coverage must be enabled first; recalculation\
    \ runs in the background."
- name: Trips
  description: "Trips are named date ranges, such as a vacation, with their own timeline,\
    \ map path, summary, and plan. A trip can be linked to a timeline label and shared\
    \ with friends as collaborators. Not to be confused with trips on the timeline,\
    \ which are movements between stays."
- name: Trip Planning
  description: Plan what to visit on a trip. Plan items are places to visit that GeoPulse
    matches against actual stays. Reconstruction fills in missing parts of a trip
    by generating GPS points from stays and movements you describe.
- name: Friends
  description: "Invite other users of the same GeoPulse instance as friends and choose\
    \ what each friend can see: live location, timeline, or both. Friend data is only\
    \ returned when the friend has granted the matching permission."
- name: Share Links
  description: Create links that share your live location or a timeline period with
    people who do not have a GeoPulse account. Links can expire and can be protected
    with a password. The public side of a link is served by **Shared Link Viewer**.
- name: Shared Link Viewer
  description: "Anonymous endpoints used by the page that opens a share link. They\
    \ need no GeoPulse account. Read the link info, get a short-lived access token\
    \ (sending the password for protected links), and send it as `Authorization: Bearer\
    \ <token>` on the other requests. Live-location links and timeline links expose\
    \ different endpoints."
- name: Geofences
  description: Geofence rules watch an area and record an event when you or a friend
    enters or leaves it. Events can be delivered as notifications through templates
    (Apprise or in-app).
- name: Notifications
  description: "In-app notifications, such as geofence events, finished imports and\
    \ exports, friend invitations, GPS health alerts, and release announcements, and\
    \ the user's notification preferences."
- name: Immich
  description: "Connect an Immich photo server to show photos on the timeline and\
    \ map. GeoPulse proxies photo thumbnails, previews, and downloads, so Immich does\
    \ not need to be reachable from the browser."
- name: Memos
  description: Connect a Memos server to store timeline notes there. See **Notes**
    for reading and writing the notes themselves.
- name: AI Assistant
  description: Configure an OpenAI-compatible AI provider and chat with an assistant
    that can answer questions about your timeline data.
- name: Places to Visit
  description: "Discover points of interest near a location, with thumbnails."
- name: Weather
  description: "Historical weather samples collected for your GPS data, when the weather\
    \ integration is enabled."
- name: Profile & Preferences
  description: "The signed-in user's profile, avatar, password, and timeline preferences.\
    \ Timeline preferences control how stays and trips are detected; changing them\
    \ usually requires regenerating the timeline."
- name: Home
  description: Content for the GeoPulse home page. Available without signing in.
- name: System
  description: "Health and version of the GeoPulse server. Available without signing\
    \ in, so they can be used by monitoring tools."
- name: "Admin: Users"
  description: "Manage user accounts: list and inspect users, change roles and status,\
    \ reset passwords, and delete accounts."
  x-displayName: Users
- name: "Admin: Invitations"
  description: Create and revoke invitation links that let people register when open
    registration is disabled.
  x-displayName: Invitations
- name: "Admin: API Tokens"
  description: Review and revoke API tokens of all users. Token secrets cannot be
    recovered.
  x-displayName: API Tokens
- name: "Admin: Audit Logs"
  description: Review the audit trail of administrator actions and security-relevant
    events.
  x-displayName: Audit Logs
- name: "Admin: Backups"
  description: "Encrypted full database backups (scheduled or on demand, download,\
    \ and restore), and export or import of the administrator-configured settings\
    \ only. A restore is prepared while GeoPulse keeps running; activating it replaces\
    \ all data and stops the backend so it can be restarted. See [Backup and Restore](https://geopulse.cc/docs/system-administration/maintenance/backup-restore)."
  x-displayName: Backups
- name: "Admin: System Settings"
  description: "View and change server-wide settings, such as sign-in and registration,\
    \ geocoding, weather, map matching, AI, import, and export. A setting that has\
    \ not been changed here uses the value from the environment configuration."
  x-displayName: System Settings
- name: "Admin: OIDC Providers"
  description: Configure OpenID Connect providers that users can sign in with. Providers
    can come from environment variables or be created here; a database copy overrides
    the environment configuration until it is reset.
  x-displayName: OIDC Providers
- name: "Admin: Geocoding Providers"
  description: "Configure additional reverse-geocoding provider instances, for example\
    \ a self-hosted Nominatim or Photon server."
  x-displayName: Geocoding Providers
- name: "Admin: Timeline Regeneration"
  description: "Regenerate timelines for many users at once, for example after changing\
    \ global timeline settings. A campaign is previewed, created, and then processed\
    \ in the background."
  x-displayName: Timeline Regeneration
- name: "Admin: Weather"
  description: Monitor the weather pipeline and queue weather backfills for existing
    GPS data.
  x-displayName: Weather
- name: "Admin: Dashboard"
  description: Server-wide metrics for the administrator dashboard.
  x-displayName: Dashboard
paths:
  /api/v1/admin/api-tokens:
    get:
      summary: List all API tokens
      description: |-
        Returns API tokens of all users one page at a time, with owner, status, expiration, and last use. Token secrets are never returned.

        **Access:** Administrators only.
      operationId: AdminApiTokenResource_listTokens
      tags:
      - "Admin: API Tokens"
      parameters:
      - description: "Page number, starting at 0."
        name: page
        in: query
        schema:
          format: int32
          default: 0
          minimum: 0
          type: integer
      - description: "Page size, from 1 to 200. Defaults to 50."
        name: size
        in: query
        schema:
          format: int32
          default: 50
          maximum: 200
          minimum: 1
          type: integer
      - description: "Only tokens with this status: `ACTIVE`, `EXPIRED`, or `REVOKED`."
        example: ACTIVE
        name: status
        in: query
        schema:
          $ref: "#/components/schemas/ApiTokenStatus"
      - description: Only tokens owned by this user.
        name: userId
        in: query
        schema:
          $ref: "#/components/schemas/UUID"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseApiTokenResponse"
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
      security:
      - bearerAuth: []
      - apiKey: []
  /api/v1/admin/api-tokens/{id}:
    delete:
      summary: Revoke a user's API token
      description: |-
        Revokes any user's API token, for example after a leak. The revocation is recorded in the audit log.

        **Access:** Administrators only.
      operationId: AdminApiTokenResource_revokeToken
      tags:
      - "Admin: API Tokens"
      parameters:
      - description: API token ID.
        name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UUID"
      responses:
        "204":
          description: No Content
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
      security:
      - bearerAuth: []
      - apiKey: []
  /api/v1/admin/audit-logs:
    get:
      summary: List audit log entries
      description: |-
        Returns administrator actions and security events, newest first, one page at a time, with filters. Each entry has the acting administrator, action, target, details, and IP address.

        **Access:** Administrators only.
      operationId: AdminAuditLogResource_getAuditLogs
      tags:
      - "Admin: Audit Logs"
      parameters:
      - description: "Only entries with this action type, such as `USER_ROLE_CHANGED`."
        name: actionType
        in: query
        schema:
          type: string
      - description: Only entries for actions by this administrator.
        name: adminUserId
        in: query
        schema:
          $ref: "#/components/schemas/UUID"
      - description: "Only entries at or after this time, in epoch milliseconds."
        example: 1735689600000
        name: from
        in: query
        schema:
          format: int64
          type: integer
      - description: "Page number, starting at 0."
        name: page
        in: query
        schema:
          format: int32
          default: 0
          minimum: 0
          type: integer
      - description: "Page size, from 1 to 200. Defaults to 20."
        name: size
        in: query
        schema:
          format: int32
          default: 20
          maximum: 200
          minimum: 1
          type: integer
      - description: "Only entries about this kind of target: `SETTING`, `USER`, `OIDC_PROVIDER`,\
          \ `INVITATION`, `API_TOKEN`, `TIMELINE_REGENERATION_CAMPAIGN`, or `BACKUP`."
        example: USER
        name: targetType
        in: query
        schema:
          type: string
      - description: "Only entries at or before this time, in epoch milliseconds."
        example: 1767225599000
        name: to
        in: query
        schema:
          format: int64
          type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseAuditLogResponse"
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
      security:
      - bearerAuth: []
      - apiKey: []
  /api/v1/admin/backups/config:
    put:
      summary: Update backup settings
      description: |-
        Updates the backup settings and reschedules automatic backups. A new password applies to new backups only.

        **Access:** Administrators only.
      operationId: AdminFullBackupResource_updateConfig
      tags:
      - "Admin: Backups"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminBackupConfigDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBackupConfigDto"
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
        "400":
          description: Bad Request
      security:
      - bearerAuth: []
      - apiKey: []
    get:
      summary: Get backup settings
      description: |-
        Returns the backup settings: whether a password is configured (the password itself is never returned), scheduled backup and cron expression, backup folder, retention count, operation timeout, and backup health alerts.

        **Access:** Administrators only.
      operationId: AdminFullBackupResource_getConfig
      tags:
      - "Admin: Backups"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBackupConfigDto"
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
      security:
      - bearerAuth: []
      - apiKey: []
  /api/v1/admin/backups/download:
    get:
      summary: Create and download a backup
      description: |-
        Creates an encrypted full database backup, saves it in the backup folder, and streams it as the response. Requires a backup password to be configured. Fails with `409` while another backup or restore is running.

        **Access:** Administrators only.
      operationId: AdminFullBackupResource_downloadFullBackup
      tags:
      - "Admin: Backups"
      responses:
        "200":
          description: Encrypted backup file
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
      security:
      - bearerAuth: []
      - apiKey: []
  /api/v1/admin/backups/files:
    get:
      summary: List backup files
      description: |-
        Returns the backup files in the configured backup folder with their sizes and modification times.

        **Access:** Administrators only.
      operationId: AdminFullBackupResource_listFiles
      tags:
      - "Admin: Backups"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminBackupFileDto"
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
      security:
      - bearerAuth: []
      - apiKey: []
  /api/v1/admin/backups/files/{fileName}:
    get:
      summary: Download a backup file
      description: |-
        Downloads an existing encrypted backup file from the backup folder.

        **Access:** Administrators only.
      operationId: AdminFullBackupResource_downloadLocalBackup
      tags:
      - "Admin: Backups"
      parameters:
      - description: "Backup file name, as returned by `GET /api/v1/admin/backups/files`."
        name: fileName
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Encrypted backup file
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
      security:
      - bearerAuth: []
      - apiKey: []
    delete:
      summary: Delete a backup file
      description: |-
        Deletes a backup file from the backup folder. Not allowed while a backup or restore is running.

        **Access:** Administrators only.
      operationId: AdminFullBackupResource_deleteLocalBackup
      tags:
      - "Admin: Backups"
      parameters:
      - description: "Backup file name, as returned by `GET /api/v1/admin/backups/files`."
        name: fileName
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
      security:
      - bearerAuth: []
      - apiKey: []
  /api/v1/admin/backups/restore/discard:
    post:
      summary: Discard a prepared restore
      description: |-
        Deletes a prepared restore that was not activated and returns to normal operation on the current data.

        **Access:** Administrators only.
      operationId: AdminFullBackupResource_discardPreparedRestore
      tags:
      - "Admin: Backups"
      responses:
        "200":
          description: Prepared restore discarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBackupStatusDto"
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
