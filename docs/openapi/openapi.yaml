---
openapi: 3.0.4
components:
  schemas:
    AccessTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          format: int64
          type: integer
    Achievements:
      type: object
      properties:
        badges:
          type: array
          items:
            $ref: "#/components/schemas/Badge"
    ActionType:
      enum:
      - SETTING_CHANGED
      - SETTING_RESET
      - ADMIN_SETTINGS_EXPORTED
      - ADMIN_SETTINGS_IMPORTED
      - ADMIN_FULL_BACKUP_CREATED
      - ADMIN_FULL_BACKUP_DOWNLOADED
      - ADMIN_FULL_BACKUP_IMPORTED
      - ADMIN_FULL_BACKUP_DELETED
      - ADMIN_FULL_RESTORE_RETRIED
      - ADMIN_FULL_RESTORE_DISCARDED
      - USER_ENABLED
      - USER_DISABLED
      - USER_DELETED
      - USER_ROLE_CHANGED
      - USER_PASSWORD_RESET
      - OIDC_PROVIDER_CREATED
      - OIDC_PROVIDER_UPDATED
      - OIDC_PROVIDER_DELETED
      - OIDC_PROVIDER_RESET
      - INVITATION_CREATED
      - INVITATION_REVOKED
      - API_TOKEN_CREATED
      - API_TOKEN_UPDATED
      - API_TOKEN_REVOKED
      - API_TOKEN_ADMIN_REVOKED
      - TIMELINE_REGENERATION_CAMPAIGN_CREATED
      - TIMELINE_REGENERATION_CAMPAIGN_RETRIED
      - MAP_MATCHING_HISTORICAL_REBUILD
      - MAP_MATCHING_CACHE_CLEARED
      - ADMIN_LOGIN
      type: string
    ActivityChartData:
      type: object
      properties:
        chartsByTripType:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/BarChartData"
    AddAreaToFavoritesDto:
      required:
      - name
      type: object
      properties:
        name:
          maxLength: 100
          pattern: \S
          type: string
          example: Office campus
        northEastLat:
          format: double
          maximum: 90.0
          minimum: -90.0
          type: number
          example: 50.452
        northEastLon:
          format: double
          maximum: 180.0
          minimum: -180.0
          type: number
          example: 30.526
        southWestLat:
          format: double
          maximum: 90.0
          minimum: -90.0
          type: number
          example: 50.449
        southWestLon:
          format: double
          maximum: 180.0
          minimum: -180.0
          type: number
          example: 30.521
    AddPointToFavoritesDto:
      required:
      - name
      type: object
      properties:
        name:
          maxLength: 100
          pattern: \S
          type: string
          example: Home
        lat:
          format: double
          maximum: 90.0
          minimum: -90.0
          type: number
          example: 50.4501
        lon:
          format: double
          maximum: 180.0
          minimum: -180.0
          type: number
          example: 30.5234
    AdminBackupConfigDto:
      type: object
      properties:
        password:
          type: string
          example: a-long-backup-passphrase
          writeOnly: true
        passwordConfigured:
          type: boolean
          example: true
        scheduledEnabled:
          type: boolean
          example: true
        scheduledCron:
          type: string
          example: 0 0 3 * * ?
        localPath:
          type: string
          example: /data/geopulse-backups
        retentionCount:
          format: int32
          type: integer
          example: 7
        operationTimeoutMinutes:
          format: int32
          type: integer
          example: 120
        healthMaxAgeDays:
          format: int32
          type: integer
          example: 2
        healthAppriseEnabled:
          type: boolean
          example: false
        healthAppriseRoutingMode:
          type: string
          allOf:
          - $ref: "#/components/schemas/AppriseExternalRoutingMode"
          example: URLS
        healthAppriseDestination:
          type: string
          example: tgram://bottoken/ChatID
        healthAppriseConfigKey:
          type: string
          example: geopulse
        healthAppriseTag:
          type: string
          example: admins
    AdminBackupCreatedResponse:
      type: object
      properties:
        fileName:
          type: string
        sizeBytes:
          format: int64
          type: integer
    AdminBackupFileDto:
      type: object
      properties:
        fileName:
          type: string
        sizeBytes:
          format: int64
          type: integer
        lastModifiedAt:
          $ref: "#/components/schemas/Instant"
    AdminBackupStatusDto:
      type: object
      properties:
        operationId:
          type: string
        stagingDatabase:
          type: string
        previousDatabase:
          type: string
        state:
          type: string
        restartRequired:
          type: boolean
        backupRunning:
          type: boolean
        restoreRunning:
          type: boolean
        restoreRequired:
          type: boolean
        environmentBlocked:
          type: boolean
        status:
          type: string
        operation:
          type: string
        fileName:
          type: string
        sizeBytes:
          format: int64
          type: integer
        phase:
          type: string
        message:
          $ref: "#/components/schemas/MessageDescriptor"
        progressPercent:
          format: int32
          type: integer
        startedAt:
          $ref: "#/components/schemas/Instant"
        completedAt:
          $ref: "#/components/schemas/Instant"
