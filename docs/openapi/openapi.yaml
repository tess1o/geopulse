    AdminSettingsBackupDto:
      type: object
      properties:
        schemaVersion:
          format: int32
          type: integer
        scope:
          type: string
        excludedConfigurationSummary:
          type: string
        exportedAt:
          $ref: "#/components/schemas/Instant"
        settings:
          type: array
          items:
            $ref: "#/components/schemas/SettingBackupDto"
        oidcProviders:
          type: array
          items:
            $ref: "#/components/schemas/OidcProviderBackupDto"
        customGeocodingProviders:
          type: array
