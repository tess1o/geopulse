      - description: API token ID.
        name: id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UUID"
      responses:
        "204":
          description: No Content
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
      security:
      - bearerAuth: []
      - apiKey: []
  /api/v1/auth/api-sessions:
    post:
      summary: Sign in and get tokens
      description: |-
        Signs in with email and password and returns the access token and refresh token in the response body instead of cookies. Send the access token as `Authorization: Bearer <token>` and renew it with `POST /api/v1/auth/api-sessions/current/refresh` before it expires. For scripts and integrations, a long-lived API token is usually simpler.

        **Access:** Public. No authentication required.
      operationId: AuthenticationResource_apiLogin
      tags:
      - Sessions
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad Request
  /api/v1/auth/api-sessions/current/refresh:
    post:
      summary: Refresh tokens
      description: |-
        Exchanges a refresh token obtained from `POST /api/v1/auth/api-sessions` for a new access token and refresh token.

        **Access:** Public. No authentication required.
      operationId: AuthenticationResource_refreshToken
      tags:
      - Sessions
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefreshRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshTokenResponse"
        "400":
          description: Bad Request
  /api/v1/auth/demo-sessions:
    post:
      summary: Sign in as a demo persona
      description: |-
        Signs in as one of the demo accounts listed by `GET /api/v1/auth/sessions/current`. Only available when the server runs in demo mode.

        **Internal:** Used by the GeoPulse web app. Not part of the documented API and can change without notice.

        **Access:** Public. No authentication required.
      x-internal: true
      operationId: AuthenticationResource_demoLogin
      tags:
      - Sessions
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoLoginRequest"
        required: true
      responses:
        "200":
          description: Authenticated demo browser session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserAuthResponse"
        "400":
          description: Bad Request
  /api/v1/auth/mobile-codes:
    post:
      summary: Create a mobile sign-in code
      description: |-
        Creates a short-lived, one-time code and a deep link that signs the GeoPulse mobile app in as the current user. Open the deep link on the phone, or pass the code to `POST /api/v1/auth/mobile-sessions`.

        **Access:** Any signed-in user, with a session or an API token.
      operationId: MobileAuthenticationResource_generateCode
      tags:
      - Mobile Sign-in
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileAuthInitResponse"
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
      security:
      - bearerAuth: []
      - apiKey: []
  /api/v1/auth/mobile-sessions:
    post:
      summary: Exchange a mobile sign-in code
      description: |-
        Exchanges a code created with `POST /api/v1/auth/mobile-codes` for access and refresh tokens. Each code works once and expires after a short time.

        **Access:** Public. No authentication required.
      operationId: MobileSessionExchangeResource_exchangeSessionCode
      tags:
      - Mobile Sign-in
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileSessionExchangeRequest"
        required: true
      responses:
        "200":
          description: Authenticated mobile session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad Request
  /api/v1/auth/oidc/account-links/oidc:
    post:
      summary: Link OIDC identity by another provider
      description: |-
        Confirms an account-linking request by signing in with a provider that is already linked to the existing account. Returns the authorization URL of that provider; the flow completes through `POST /api/v1/auth/oidc/callbacks`.

        **Internal:** Used by the GeoPulse web app. Not part of the documented API and can change without notice.

        **Access:** Public. No authentication required.
      x-internal: true
      operationId: OidcAuthenticationResource_linkAccountWithOidc
      tags:
      - OIDC Sign-in
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiateOidcLinkingRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcLoginInitResponse"
        "400":
          description: Bad Request
  /api/v1/auth/oidc/account-links/password:
    post:
      summary: Link OIDC identity by password
      description: |-
        Confirms an account-linking request by verifying the existing account password. Use the linking token from the `OIDC_ACCOUNT_LINKING_REQUIRED` error. On success, the OIDC identity is linked and the user is signed in.

        **Internal:** Used by the GeoPulse web app. Not part of the documented API and can change without notice.

        **Access:** Public. No authentication required.
      x-internal: true
      operationId: OidcAuthenticationResource_linkAccountWithPassword
      tags:
      - OIDC Sign-in
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkAccountWithPasswordRequest"
        required: true
      responses:
        "200":
          description: Linked and authenticated browser session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserAuthResponse"
        "400":
          description: Bad Request
  /api/v1/auth/oidc/callbacks:
    post:
      summary: Complete OIDC sign-in
      description: |-
        Completes an OIDC sign-in or account-linking flow with the authorization code and state the provider returned. On success, sets the session cookies like password sign-in. A new account is created on first sign-in when OIDC registration is enabled. If an account with the same email already exists, the request fails with `OIDC_ACCOUNT_LINKING_REQUIRED` and the error contains a linking token for `POST /api/v1/auth/oidc/account-links/password` or `POST /api/v1/auth/oidc/account-links/oidc`.

        **Internal:** Used by the GeoPulse web app. Not part of the documented API and can change without notice.

        **Access:** Public. No authentication required.
      x-internal: true
      operationId: OidcAuthenticationResource_handleCallback
      tags:
      - OIDC Sign-in
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcCallbackRequest"
        required: true
      responses:
        "200":
          description: Authenticated browser session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserAuthResponse"
        "400":
          description: Bad Request
  /api/v1/auth/oidc/connections:
    get:
      summary: List linked OIDC providers
      description: |-
        Returns the OIDC providers linked to the signed-in account.

        **Internal:** Used by the GeoPulse web app. Not part of the documented API and can change without notice.

        **Access:** Any signed-in user, with a session or an API token.
      x-internal: true
      operationId: OidcAuthenticationResource_getUserConnections
      tags:
      - OIDC Sign-in
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserOidcConnectionResponse"
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
      security:
      - bearerAuth: []
      - apiKey: []
  /api/v1/auth/oidc/connections/{provider}:
    delete:
      summary: Unlink an OIDC provider
      description: |-
        Removes the link between the signed-in account and an OIDC provider.

        **Internal:** Used by the GeoPulse web app. Not part of the documented API and can change without notice.

        **Access:** Any signed-in user, with a session or an API token.
      x-internal: true
      operationId: OidcAuthenticationResource_unlinkProvider
      tags:
      - OIDC Sign-in
      parameters:
      - description: Provider name to unlink.
        example: google
        name: provider
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
      security:
      - bearerAuth: []
      - apiKey: []
  /api/v1/auth/oidc/connections/{provider}/authorizations:
    post:
      summary: Start linking an OIDC provider
      description: |-
        Starts linking an OIDC provider to the signed-in account. Returns the provider authorization URL; the flow completes through `POST /api/v1/auth/oidc/callbacks`.

        **Internal:** Used by the GeoPulse web app. Not part of the documented API and can change without notice.

        **Access:** Any signed-in user, with a session or an API token.
      x-internal: true
      operationId: OidcAuthenticationResource_initiateLinking
      tags:
      - OIDC Sign-in
      parameters:
      - description: Provider name to link.
        example: google
        name: provider
        in: path
        required: true
        schema:
          type: string
      - description: Web app path to open after linking completes. Defaults to `/app/profile`.
        example: /app/profile
        name: redirectUri
        in: query
        schema:
          default: /app/profile
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcLoginInitResponse"
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
      security:
      - bearerAuth: []
      - apiKey: []
  /api/v1/auth/oidc/login-authorizations/{provider}:
    post:
      summary: Start OIDC sign-in
      description: |-
        Starts signing in with an OIDC provider. Returns the provider authorization URL to redirect the browser to. After the user signs in at the provider, the provider redirects back to the GeoPulse web app, which completes the flow with `POST /api/v1/auth/oidc/callbacks`.

        **Internal:** Used by the GeoPulse web app. Not part of the documented API and can change without notice.

        **Access:** Public. No authentication required.
      x-internal: true
      operationId: OidcAuthenticationResource_initiateLogin
      tags:
      - OIDC Sign-in
      parameters:
      - description: "Provider name, as returned by `GET /api/v1/auth/oidc/providers`."
        example: google
        name: provider
        in: path
        required: true
        schema:
          type: string
      - description: Web app path to open after sign-in completes. Defaults to `/app/timeline`.
        example: /app/timeline
        name: redirectUri
        in: query
        schema:
          default: /app/timeline
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcLoginInitResponse"
  /api/v1/auth/oidc/providers:
    get:
      summary: List OIDC providers
      description: |-
        Returns the OpenID Connect providers users can sign in with, including their display names and icons.

        **Access:** Public. No authentication required.
      operationId: OidcAuthenticationResource_getEnabledProviders
      tags:
      - OIDC Sign-in
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OidcProviderResponse1"
  /api/v1/auth/sessions:
    post:
      summary: Sign in with email and password
      description: |-
        Signs in a browser user. On success the session is stored in secure HTTP-only cookies (access token, refresh token, and expiration time) and the response describes the signed-in user. Fails when password login is disabled for this user. API clients that cannot use cookies should call `POST /api/v1/auth/api-sessions` or, better, use an API token.

        **Access:** Public. No authentication required.
      operationId: AuthenticationResource_loginUser
      tags:
      - Sessions
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: Authenticated browser session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserAuthResponse"
        "400":
          description: Bad Request
  /api/v1/auth/sessions/current:
    delete:
      summary: Sign out
      description: |-
        Ends the browser session by clearing the session cookies. Access tokens already issued to API clients stay valid until they expire.

        **Access:** Public. No authentication required.
      operationId: AuthenticationResource_logout
      tags:
      - Sessions
      responses:
        "204":
          description: Authentication cookies cleared
    get:
      summary: Get sign-in options
      description: |-
        Returns which sign-in and registration methods are enabled on this server (password, OIDC), whether demo mode is on, and the available demo personas. It does not say who is signed in; use `GET /api/v1/users/me` for that.

        **Access:** Public. No authentication required.
      operationId: AuthenticationResource_getAuthStatus
      tags:
      - Sessions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatusResponse"
  /api/v1/auth/sessions/current/refresh:
    post:
      summary: Refresh the browser session
      description: |-
        Renews the browser session using the refresh-token cookie and sets new session cookies. Used by the web app; API clients should use `POST /api/v1/auth/api-sessions/current/refresh`.

        **Access:** Public. No authentication required.
      operationId: AuthenticationResource_refreshTokenCookie
      tags:
      - Sessions
      parameters:
      - description: Refresh token cookie set at sign-in. Sent by the browser automatically.
        name: refresh_token
        in: cookie
        schema:
          type: string
      responses:
        "204":
          description: Authentication cookies refreshed
  /api/v1/coverage/cells:
    get:
      summary: Get coverage cells
      description: |-
        Returns the explored grid cells inside a bounding box for drawing on a map. Coverage must be enabled.

        **Access:** Any signed-in user, with a session or an API token.
      operationId: CoverageResource_getCoverageCells
      tags:
      - Coverage
      parameters:
      - description: "Bounding box as `minLon,minLat,maxLon,maxLat` in degrees. Required."
        example: "-9.25,38.69,-9.09,38.80"
        name: bbox
        in: query
        schema:
          type: string
      - description: "Grid cell size in meters: 20, 50 (default), 250, 1000, 5000,\
          \ 20000, or 40000."
        example: 50
        name: grid
        in: query
        schema:
          format: int32
          type: integer
      - description: "Maximum number of cells, up to 12000. Defaults to 12000."
        name: limit
        in: query
        schema:
          format: int32
          minimum: 1
          type: integer
      responses:
        "200":
          description: Coverage cells retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoverageCell"
        "400":
          description: Invalid coverage query
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblemResponse"
        "403":
          description: The authenticated user does not have permission to access this
            resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblemResponse"
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
      security:
      - bearerAuth: []
      - apiKey: []
  /api/v1/coverage/recalculations:
    post:
      summary: Recalculate coverage
      description: |-
        Rebuilds coverage from all GPS points in the background. Coverage must be enabled. Not allowed while an import is running, because the import updates coverage itself.

        **Access:** Any signed-in user, with a session or an API token.
      operationId: CoverageResource_recalculateCoverage
      tags:
      - Coverage
      responses:
        "200":
          description: Coverage recalculation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverageStatus"
        "400":
          description: Coverage is not enabled
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblemResponse"
        "409":
          description: An import already manages recalculation
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblemResponse"
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
      security:
      - bearerAuth: []
      - apiKey: []
  /api/v1/coverage/settings:
    put:
      summary: Enable or disable coverage
      description: |-
        Turns coverage on or off for the signed-in user. Turning it on starts calculating coverage from existing GPS points in the background.

        **Access:** Any signed-in user, with a session or an API token.
      operationId: CoverageResource_updateCoverageSettings
      tags:
      - Coverage
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoverageSettingsRequest"
        required: true
      responses:
        "200":
          description: Coverage settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverageStatus"
        "400":
          description: Invalid coverage settings
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblemResponse"
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
      security:
      - bearerAuth: []
      - apiKey: []
  /api/v1/coverage/status:
    get:
      summary: Get coverage status
      description: |-
        Returns whether coverage is enabled for the signed-in user and the state of coverage processing: whether it is running and when it last finished.

        **Access:** Any signed-in user, with a session or an API token.
      operationId: CoverageResource_getCoverageStatus
      tags:
      - Coverage
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverageStatus"
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
      security:
      - bearerAuth: []
      - apiKey: []
  /api/v1/coverage/summary:
    get:
      summary: Get coverage summary
      description: |-
        Returns totals for one grid size, such as the number of explored cells and the covered area. Coverage must be enabled.

        **Access:** Any signed-in user, with a session or an API token.
      operationId: CoverageResource_getCoverageSummary
      tags:
      - Coverage
      parameters:
      - description: "Grid cell size in meters: 20, 50 (default), 250, 1000, 5000,\
          \ 20000, or 40000."
        example: 50
        name: grid
        in: query
        schema:
          format: int32
          type: integer
      responses:
        "200":
          description: Coverage summary retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverageSummary"
        "400":
          description: Invalid coverage grid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblemResponse"
        "403":
          description: The authenticated user does not have permission to access this
            resource.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblemResponse"
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
      security:
      - bearerAuth: []
      - apiKey: []
  /api/v1/debug-imports:
    post:
      summary: Import a debug export
      description: |-
        Imports a ZIP archive created by `POST /api/v1/exports/debug`, which is used to reproduce timeline issues. By default, the user's existing data is deleted first and the timeline settings from the archive are applied. Intended for troubleshooting, not for regular imports.

        **Internal:** Used by the GeoPulse web app. Not part of the documented API and can change without notice.

        **Access:** Any signed-in user, with a session or an API token.
      x-internal: true
      operationId: DebugImportResource_uploadDebugData
      tags:
      - Import
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  format: binary
                  type: string
                clearExistingData:
                  default: true
                  type: boolean
                updateTimelineConfig:
                  default: true
                  type: boolean
        required: true
      responses:
        "201":
          description: Created
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
      security:
      - bearerAuth: []
      - apiKey: []
  /api/v1/digest-heatmaps/monthly:
