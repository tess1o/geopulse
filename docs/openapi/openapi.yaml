      - apiKey: []
    delete:
      summary: Revoke an API token
      description: |-
        Revokes an API token owned by the signed-in user. Requests using the token are rejected from then on.

        **Access:** Any signed-in user, with a session or an API token.
      operationId: ApiTokenResource_revokeToken
      tags:
      - API Tokens
