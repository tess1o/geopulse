        **Access:** Any signed-in user, with a session or an API token.
      operationId: StreamingTimelineResource_getTimeline
      tags:
      - Timeline
      parameters:
      - description: "Start of the time range, as an ISO-8601 instant. Defaults to\
          \ the earliest data."
        example: 2025-06-01T00:00:00Z
        name: from
        in: query
        schema:
          type: string
      - description: "Add the local timezone of each stay, trip endpoint, and data\
          \ gap (`locationTimezone`, `startLocationTimezone`, `endLocationTimezone`),\
          \ resolved from the nearest GeoNames city. Defaults to `false`."
        name: includeLocationTimezones
        in: query
        schema:
          default: false
          type: boolean
      - description: "End of the time range, as an ISO-8601 instant. Defaults to now."
        example: 2025-06-07T23:59:59Z
        name: to
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovementTimelineDTO"
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
