                      altitude: 296
                      speed: 2.7
                      horizontal_accuracy: 8
                      vertical_accuracy: 3
                      speed_accuracy: 0.5
                      course: 135
                      course_accuracy: 10
                      motion:
                      - walking
                      battery_state: unplugged
                      battery_level: 0.82
                      wifi: ""
