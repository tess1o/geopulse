          \ /api/v1/timeline`. Not a planned trip ID."
        name: tripId
        in: path
        required: true
        schema:
          format: int64
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripMovementTypeUpdateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripMovementTypeUpdateResponseDTO"
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
        "400":
          description: Bad Request
      security:
      - bearerAuth: []
      - apiKey: []
    delete:
      summary: Reset a movement type
      description: |-
        Removes a manual movement type so the detected type is used again.

        **Access:** Any signed-in user, with a session or an API token.
      operationId: TripTimelineResource_resetTripMovementType
      tags:
      - Timeline Corrections
      parameters:
      - description: "ID of a trip (movement) on the timeline, as returned by `GET\
          \ /api/v1/timeline`. Not a planned trip ID."
        name: tripId
        in: path
        required: true
        schema:
          format: int64
          type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripMovementTypeUpdateResponseDTO"
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
      security:
      - bearerAuth: []
      - apiKey: []
  /api/v1/trips/{tripId}/timeline/stay-split:
    put:
      summary: Split a trip with a stay
      description: |-
        Turns part of a timeline trip into a stay, splitting it into trip, stay, trip. The split is saved as an override and kept when the timeline is regenerated; undo it with `DELETE /api/v1/timeline/stay-split-overrides/{overrideId}`.

        **Access:** Any signed-in user, with a session or an API token.
      operationId: TripTimelineResource_splitTripWithStay
      tags:
      - Timeline Corrections
      parameters:
      - description: "ID of a trip (movement) on the timeline, as returned by `GET\
          \ /api/v1/timeline`. Not a planned trip ID."
        name: tripId
        in: path
        required: true
        schema:
          format: int64
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripStaySplitRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripStaySplitResponse"
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
        "400":
          description: Bad Request
      security:
      - bearerAuth: []
      - apiKey: []
  /api/v1/trips/{tripId}/timeline/stay-split/preview:
    post:
      summary: Preview splitting a trip with a stay
      description: |-
        Shows how a timeline trip would look if part of it were turned into a stay, for example a stop the detection missed. Nothing is saved.

        **Internal:** Used by the GeoPulse web app. Not part of the documented API and can change without notice.

        **Access:** Any signed-in user, with a session or an API token.
      x-internal: true
      operationId: TripTimelineResource_previewTripStaySplit
      tags:
      - Timeline Corrections
      parameters:
      - description: "ID of a trip (movement) on the timeline, as returned by `GET\
          \ /api/v1/timeline`. Not a planned trip ID."
        name: tripId
        in: path
        required: true
        schema:
          format: int64
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripStaySplitRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripStaySplitResponse"
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
        "400":
          description: Bad Request
      security:
      - bearerAuth: []
      - apiKey: []
  /api/v1/trips/{tripId}/visit-suggestions:
    get:
      summary: Get visit suggestions
      description: |-
        Returns stays that GeoPulse matched to the trip's plan items, with distance, confidence, and whether each match was applied. Confirm or override a match with `PUT /api/v1/trips/{tripId}/plan-items/{itemId}/visit-override`.

        **Access:** Any signed-in user, with a session or an API token.
      operationId: TripVisitMatchingResource_getVisitSuggestions
      tags:
      - Trips
      parameters:
      - description: Trip ID.
        name: tripId
        in: path
        required: true
        schema:
          format: int64
          type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TripVisitSuggestionDto"
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
      security:
      - bearerAuth: []
      - apiKey: []
  /api/v1/users/me:
    patch:
      summary: Update your profile
      description: |-
        Updates the signed-in user's full name, avatar choice, timezone, and UI preferences such as the distance unit. The timezone is used for daily statistics, digests, and other day-based views.

        **Access:** Any signed-in user, with a session or an API token.
      operationId: UserResource_updateProfile
      tags:
      - Profile & Preferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
      security:
      - bearerAuth: []
      - apiKey: []
    get:
      summary: Get your profile
      description: |-
        Returns the signed-in user: ID, email, name, role, timezone, avatar, and preferences. Useful for checking which user an API token belongs to.

        **Access:** Any signed-in user, with a session or an API token.
      operationId: UserResource_getCurrentUserProfile
      tags:
      - Profile & Preferences
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
      security:
      - bearerAuth: []
      - apiKey: []
  /api/v1/users/me/avatar:
    put:
      summary: Upload an avatar image
      description: |-
        Uploads a custom avatar image (multipart field `file`) for the signed-in user and returns its path.

        **Access:** Any signed-in user, with a session or an API token.
      operationId: UserResource_uploadAvatar
      tags:
      - Profile & Preferences
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  format: binary
                  type: string
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarResponse"
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
      security:
      - bearerAuth: []
      - apiKey: []
  /api/v1/users/me/password:
    put:
      summary: Change your password
      description: |-
        Changes the signed-in user's password. The current password is required when one is set; accounts created through OIDC can set a first password this way.

        **Access:** Any signed-in user, with a session or an API token.
      operationId: UserResource_changePassword
      tags:
      - Profile & Preferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserPasswordRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordStatusResponse"
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
        "400":
          description: Bad Request
      security:
      - bearerAuth: []
      - apiKey: []
  /api/v1/users/{userId}/avatar:
    get:
      summary: Get a user's avatar
      description: |-
        Returns the custom avatar image of a user. Supports `If-None-Match` with the returned `ETag`, answering `304 Not Modified` when the image has not changed.

        **Access:** Any signed-in user, with a session or an API token.
      operationId: UserResource_getUserAvatar
      tags:
      - Profile & Preferences
      parameters:
      - description: User ID.
        name: userId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/UUID"
      - description: "ETag from a previous response, to receive `304 Not Modified`\
          \ when the avatar is unchanged."
        name: If-None-Match
        in: header
        schema:
          type: string
      responses:
        "200":
          description: User avatar
          content:
            image/jpeg:
              schema:
                format: binary
                type: string
            image/png:
              schema:
                format: binary
                type: string
            image/webp:
              schema:
                format: binary
                type: string
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
      security:
      - bearerAuth: []
      - apiKey: []
  /api/v1/weather/samples:
    get:
      summary: Get weather samples
      description: |-
        Returns the weather samples recorded for the signed-in user's GPS data in a time range, optionally inside a bounding box, with units and provider attribution. Empty when the weather integration is disabled.

        **Access:** Any signed-in user, with a session or an API token.
      operationId: WeatherResource_getSamples
      tags:
      - Weather
      parameters:
      - description: "Start of the time range, as an ISO-8601 instant. Defaults to\
          \ the earliest data."
        example: 2025-06-01T00:00:00Z
        name: from
        in: query
        schema:
          type: string
      - description: "Northern edge of the bounding box, in degrees."
        name: maxLat
        in: query
        schema:
          format: double
          type: number
      - description: "Eastern edge of the bounding box, in degrees."
        name: maxLon
        in: query
        schema:
          format: double
          type: number
      - description: "Southern edge of the bounding box, in degrees."
        name: minLat
        in: query
        schema:
          format: double
          type: number
      - description: "Western edge of the bounding box, in degrees."
        name: minLon
        in: query
        schema:
          format: double
          type: number
      - description: "End of the time range, as an ISO-8601 instant. Defaults to now."
        example: 2025-06-30T23:59:59Z
        name: to
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherSamplesResponse"
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
      security:
      - bearerAuth: []
      - apiKey: []
  /api/v1/weather/status:
    get:
      summary: Get weather integration status
      description: |-
        Returns whether the weather integration is enabled and configured on this server, and which provider it uses.

        **Access:** Any signed-in user, with a session or an API token.
      operationId: WeatherResource_getStatus
      tags:
      - Weather
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherIntegrationStatusResponse"
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
      security:
      - bearerAuth: []
      - apiKey: []
