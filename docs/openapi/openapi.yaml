  /api/v1/preferences/timeline:
    put:
      summary: Update timeline settings
      description: |-
        Changes the settings that control how stays, trips, and data gaps are detected. Changes that affect detection start a timeline regeneration and return its job ID; enabling boat detection starts the boat setup job instead. Changes that only affect movement-type classification reclassify existing trips in the background and return `204 No Content`.

        **Access:** Any signed-in user, with a session or an API token.
      operationId: UserResource_updateTimelinePreferences
      tags:
      - Profile & Preferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTimelinePreferencesRequest"
        required: true
      responses:
        "204":
          description: Preferences updated without starting a job
        "200":
          description: Timeline regeneration or boat setup started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelinePreferencesUpdateResponse"
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
        "400":
          description: Bad Request
      security:
      - bearerAuth: []
      - apiKey: []
    delete:
      summary: Reset timeline settings
      description: |-
        Removes the user's own timeline settings so the server defaults apply again, and starts a timeline regeneration when that changes anything.

        **Access:** Any signed-in user, with a session or an API token.
      operationId: UserResource_resetPreferencesToDefaults
      tags:
      - Profile & Preferences
      responses:
        "204":
          description: Preferences reset without starting a job
        "200":
          description: Timeline regeneration started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelinePreferencesUpdateResponse"
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
      security:
      - bearerAuth: []
      - apiKey: []
