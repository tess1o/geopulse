      description: HTTP Problem Response according to RFC9457 and RFC7807
      type: object
      properties:
        type:
          format: uri
          description: A optional URI reference that identifies the problem type
          type: string
          example: https://example.com/errors/not-found
        title:
          description: "A optional, short, human-readable summary of the problem type"
          type: string
          example: Not Found
        status:
          format: int32
          description: The HTTP status code for this occurrence of the problem
          type: integer
          example: 404
        detail:
          description: A optional human-readable explanation specific to this occurrence
            of the problem
          type: string
          example: Record not found
        instance:
          format: uri
          description: A URI reference that identifies the specific occurrence of
            the problem
          type: string
          example: https://api.example.com/errors/123
      additionalProperties: true
    HttpValidationProblem:
      description: HTTP Validation Problem Response according to RFC9457 and RFC7807
      type: object
      properties:
        type:
          format: uri
          description: A optional URI reference that identifies the problem type
          type: string
          example: https://example.com/errors/not-found
        title:
          description: "A optional, short, human-readable summary of the problem type"
          type: string
          example: Not Found
        status:
          format: int32
          description: The HTTP status code for this occurrence of the problem
          type: integer
          example: 404
        detail:
          description: A optional human-readable explanation specific to this occurrence
            of the problem
          type: string
          example: Record not found
        instance:
          format: uri
          description: A URI reference that identifies the specific occurrence of
            the problem
          type: string
          example: https://api.example.com/errors/123
        violations:
          description: List of validation constraint violations that occurred
          type: array
          items:
            $ref: "#/components/schemas/Violation"
      additionalProperties: true
