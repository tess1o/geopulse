        name: month
        in: query
        schema:
          format: int32
          type: integer
      - description: "Year, from 2000 to 2100."
        example: 2025
        name: year
        in: query
        schema:
          format: int32
          type: integer
      responses:
        "200":
          description: Monthly heatmap retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HeatmapDataPoint"
        "400":
          description: Invalid heatmap period or layer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblemResponse"
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
      security:
      - bearerAuth: []
      - apiKey: []
  /api/v1/digest-heatmaps/range:
    get:
      summary: Get a heatmap for a range
      description: |-
        Returns heatmap points for a custom time range. Each point has coordinates, a place name when known, the number of visits, and the time spent, for drawing a heatmap.

        **Access:** Any signed-in user, with a session or an API token.
      operationId: DigestHeatmapResource_getRangeHeatmap
      tags:
      - Digests
      parameters:
      - description: "Start of the time range, as an ISO-8601 instant. Required."
        example: 2025-06-01T00:00:00Z
        name: from
        in: query
        schema:
          type: string
      - description: "What to include: `stays`, `trips`, or `combined` (default)."
        example: stays
        name: layer
        in: query
        schema:
          type: string
      - description: "End of the time range, as an ISO-8601 instant. Required."
        example: 2025-06-30T23:59:59Z
        name: to
        in: query
        schema:
          type: string
      responses:
        "200":
          description: Heatmap range retrieved
          content:
            application/json:
              schema:
