      description: |-
        Returns whether the server is in maintenance mode, for example while a backup is being restored, so clients can show a notice and pause requests.

        **Internal:** Used by the GeoPulse web app. Not part of the documented API and can change without notice.

        **Access:** Public. No authentication required.
      x-internal: true
      operationId: MaintenanceStatusResource_status
      tags:
      - System
