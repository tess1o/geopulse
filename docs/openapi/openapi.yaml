  /api/v1/gps/ingest/owntracks:
    post:
      summary: Ingest OwnTracks location
      description: |-
        Receives an OwnTracks HTTP-mode message and stores location updates as GPS points for the user who owns the OwnTracks GPS source. Encrypted payloads are decrypted with the source's encryption key. Messages other than `location`, and payloads that cannot be decrypted, are accepted and ignored. OwnTracks points of interest and tags in the message are stored too.

        **Access:** Credentials of a GPS source configured in GeoPulse, not a session or API token.
      operationId: OwnTracksResource_handleOwnTracks
      tags:
      - GPS Tracker Ingest
      parameters:
      - description: "OwnTracks device identifier. When missing, the device is taken\
          \ from the message topic (`owntracks/<user>/<device>`)."
        example: phone
        name: X-Limit-D
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              location:
                value:
                  _type: location
                  tid: jp
                  topic: owntracks/jane/phone
                  lat: 49.8419
                  lon: 24.0315
                  acc: 8
                  alt: 296
                  vac: 3
                  vel: 10
                  cog: 135
                  batt: 82
                  bs: 1
                  conn: m
                  m: 1
                  t: u
                  tst: 1749287730
                  created_at: 1749287731
            schema:
              $ref: "#/components/schemas/OwnTracksLocationMessage"
        required: true
      responses:
        "200":
          description: Message accepted or ignored. The body is an empty JSON array.
          content:
            application/json:
              schema:
                type: array
        "400":
          description: Bad Request
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
      security:
      - gpsSourceBasic: []
  /api/v1/gps/ingest/traccar:
    post:
      summary: Ingest Traccar position
      description: |-
        Receives a position forwarded by a Traccar server and stores it as a GPS point. Several Traccar GPS sources can share one token: the position is stored for every active source whose device ID matches the position's device or, when none matches, for every source without a device ID.

        **Access:** Credentials of a GPS source configured in GeoPulse, not a session or API token.
      operationId: TraccarResource_handleTraccar
      tags:
      - GPS Tracker Ingest
      requestBody:
        content:
          application/json:
            examples:
              position:
                value:
                  position:
                    id: 18452
                    deviceId: 3
                    protocol: osmand
                    serverTime: 2025-06-07T09:15:31.000+00:00
                    deviceTime: 2025-06-07T09:15:30.000+00:00
                    fixTime: 2025-06-07T09:15:30.000+00:00
                    valid: true
                    latitude: 49.8419
                    longitude: 24.0315
                    altitude: 296.0
                    speed: 5.2
                    course: 135.0
                    address: null
                    accuracy: 8.0
                    network: null
                    geofenceIds: null
                    attributes:
                      batteryLevel: 82.0
                      distance: 14.6
                      totalDistance: 152304.7
                      motion: true
                  device:
                    id: 3
                    name: Pixel 8
                    uniqueId: "864213"
                    status: online
                    lastUpdate: 2025-06-07T09:15:31.000+00:00
                    positionId: 18452
                    groupId: 0
                    calendarId: 0
                    phone: null
                    model: null
                    contact: null
                    category: null
                    disabled: false
                    expirationTime: null
                    attributes: {}
            schema:
              $ref: "#/components/schemas/TraccarPositionData"
        required: true
      responses:
        "200":
          description: "Position accepted, or ignored when no source matches the device"
          content:
            application/json:
              schema: {}
        "400":
          description: Bad Request
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
      security:
      - gpsSourceToken: []
  /api/v1/gps/points:
    post:
      summary: Upload points from the mobile app
      description: |-
        Stores a batch of GPS points sent by the GeoPulse mobile app for the signed-in user. The server-wide default filters for inaccurate points and duplicates apply. Third-party tracker apps should use the **GPS Tracker Ingest** endpoints instead.

        **Access:** Any signed-in user, with a session or an API token.
      operationId: GpsPointResource_ingestMobileAppPoints
      tags:
      - GPS Points
      parameters:
      - description: Device identifier stored with the points. Defaults to `MOBILE
          APP`.
        example: pixel-8
        name: X-Device-Id
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              points:
                value:
                  points:
                  - timestamp: 2025-06-07T09:15:30Z
                    coordinates:
                      lat: 49.8419
                      lng: 24.0315
                    accuracy: 8.0
                    battery: 82.0
                    velocity: 1.4
                    altitude: 296.0
                  - timestamp: 2025-06-07T09:16:30Z
                    coordinates:
                      lat: 49.8412
                      lng: 24.0331
                    accuracy: 6.0
                    battery: 82.0
                    velocity: 1.5
                    altitude: 294.0
            schema:
              $ref: "#/components/schemas/GpsPointsRetentionRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GpsIngestionResponse"
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
        "400":
          description: Bad Request
      security:
      - bearerAuth: []
      - apiKey: []
    get:
      summary: List GPS points
      description: |-
        Returns GPS points one page at a time, with optional filters and sorting.

        **Access:** Any signed-in user, with a session or an API token.
      operationId: GpsPointResource_getGpsPoints
      tags:
      - GPS Points
      parameters:
      - description: "Maximum reported accuracy, in meters."
        name: accuracyMax
        in: query
        schema:
          format: double
          type: number
      - description: "Minimum reported accuracy, in meters."
        name: accuracyMin
        in: query
        schema:
          format: double
          type: number
      - description: "Start of the time range: an ISO-8601 instant, or a date (`YYYY-MM-DD`,\
          \ start of day UTC)."
        example: 2025-06-01
        name: from
        in: query
        schema:
          type: string
      - description: "Add the local timezone of each point (`locationTimezone`), resolved\
          \ from the nearest GeoNames city. Defaults to `false`."
        name: includeLocationTimezones
        in: query
        schema:
          default: false
          type: boolean
      - description: "Page number, starting at 1."
        name: page
        in: query
        schema:
          format: int32
          default: 1
          type: integer
      - description: "Page size, from 1 to 1000. Defaults to 50."
        name: size
        in: query
        schema:
          format: int32
          default: 50
          type: integer
      - description: "Sort field: `timestamp`, `altitude`, `battery`, `velocity`,\
          \ or `accuracy`. Defaults to `timestamp`."
        name: sortBy
        in: query
        schema:
          default: timestamp
          type: string
      - description: "Sort direction: `asc` or `desc`. Defaults to `desc`."
        name: sortDirection
        in: query
        schema:
          default: desc
          type: string
      - description: "Comma-separated source types to include: `OWNTRACKS`, `GPSLOGGER`,\
          \ `OVERLAND`, `TRACCAR`, `GOOGLE_TIMELINE`, `GPX`, `DAWARICH`, `HOME_ASSISTANT`,\
          \ `GEOJSON`, `CSV`, `COLOTA`, `MANUAL`, `MOBILE_APP`."
        example: "OWNTRACKS,GPX"
        name: sourceTypes
        in: query
        schema:
          type: string
      - description: "Maximum speed, in km/h."
        name: speedMax
        in: query
        schema:
          format: double
          type: number
      - description: "Minimum speed, in km/h."
        name: speedMin
        in: query
        schema:
          format: double
          type: number
      - description: "End of the time range: an ISO-8601 instant, or a date (`YYYY-MM-DD`,\
          \ end of day UTC)."
        example: 2025-06-30
        name: to
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseGpsPointDTO"
        "401":
          description: Authentication is required or the provided credentials are
            invalid.
        "403":
          description: The authenticated user does not have permission to access this
            resource.
      security:
      - bearerAuth: []
      - apiKey: []
    delete:
      summary: Delete all GPS data
      description: |-
        Permanently deletes all GPS points of the signed-in user together with the generated timeline (stays, trips, and data gaps). This cannot be undone.

        **Access:** Any signed-in user, with a session or an API token.
