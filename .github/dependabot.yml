version: 2

# Weekly, one grouped PR per ecosystem to keep the update noise low.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - /frontend
      - /tests
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # PrimeVue 5 is no longer MIT-licensed.
      - dependency-name: "primevue"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@primevue/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gomod
    directory: /demo-integrations
    schedule:
      interval: weekly
    groups:
      gomod:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
      - /demo-integrations
      - /tests
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    ignore:
      # Stay on the Java 25 LTS line; move to the next LTS deliberately.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
