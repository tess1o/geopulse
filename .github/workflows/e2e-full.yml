name: Full E2E

# Reusable full E2E suite (RASTER + VECTOR + mobile + OIDC), called by Manual Full E2E and Pre-Release Validation.
# The images are built once, then each shard runs its slice of the suite against its own backend and database.
on:
  workflow_call:
    inputs:
      retention-days:
        description: Days to keep the reports and test results
        type: number
        default: 14

env:
  # Fixes the names compose gives the built images, so the shards can load them by name.
  COMPOSE_PROJECT_NAME: geopulse-e2e
  E2E_COMPOSE_FILE: tests/docker-compose.e2e.yml
  E2E_BUILT_IMAGES: geopulse-e2e-geopulse-backend-e2e geopulse-e2e-geopulse-ui-e2e geopulse-e2e-geopulse-demo-integrations-e2e

jobs:
  build-images:
    name: Build E2E images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build native backend, UI and demo integrations
        run: docker compose -f "$E2E_COMPOSE_FILE" build geopulse-backend-e2e geopulse-ui-e2e geopulse-demo-integrations-e2e

      - name: Save images
        run: |
          docker image inspect $E2E_BUILT_IMAGES > /dev/null
          docker save $E2E_BUILT_IMAGES | gzip -1 > e2e-images.tar.gz
          ls -lh e2e-images.tar.gz

      - name: Upload images
        uses: actions/upload-artifact@v7
        with:
          name: e2e-images
          path: e2e-images.tar.gz
          retention-days: 1
          compression-level: 0

  e2e:
    name: E2E (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: build-images
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shard 1 of 4
            id: shard-1
            args: --shard=1/4
          - name: shard 2 of 4
            id: shard-2
            args: --shard=2/4
          - name: shard 3 of 4
            id: shard-3
            args: --shard=3/4
          - name: shard 4 of 4
            id: shard-4
            args: --shard=4/4
          # OIDC specs switch global auth settings, so they get a backend of their own instead of
          # waiting for the other projects (their dependency) to finish on a shared one.
          - name: OIDC
            id: oidc
            args: --project=chromium-oidc --no-deps

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download images
        uses: actions/download-artifact@v8
        with:
          name: e2e-images

      - name: Load images
        run: gunzip -c e2e-images.tar.gz | docker load && rm e2e-images.tar.gz

      - name: Start E2E environment
        run: docker compose -f "$E2E_COMPOSE_FILE" up -d --no-build geopulse-postgres-e2e geopulse-backend-e2e geopulse-ui-e2e geopulse-demo-integrations-e2e

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for backend to be ready..."
          timeout 120 bash -c 'until curl -f http://localhost:8081/api/v1/system/health; do echo "Waiting..."; sleep 5; done'

          echo "Waiting for frontend to be ready..."
          timeout 60 bash -c 'until curl -f http://localhost:5556; do echo "Waiting..."; sleep 5; done'

          echo "All services are ready!"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.10.0'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install Playwright dependencies
        run: |
          cd tests
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          cd tests
          if [ "${{ matrix.id }}" = "oidc" ]; then
            projects="${{ matrix.args }}"
          else
            projects="--project=chromium --project=chromium-vector --project=chromium-timeline-vector --project=chromium-timeline-mobile ${{ matrix.args }}"
          fi
          npx playwright test $projects --reporter=blob,list
        env:
          BASE_URL: http://localhost:5556
          PLAYWRIGHT_WORKERS: 3
          CI: true

      - name: Validate native backend logs
        if: always()
        run: node tests/scripts/validate-backend-logs.js

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.id }}
          path: tests/blob-report/
          retention-days: 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ matrix.id }}
          path: tests/test-results/
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: ignore

      - name: Show environment logs on failure
        if: failure()
        run: |
          echo "=== Backend logs ==="
          docker logs geopulse-backend-e2e || true
          echo ""
          echo "=== Frontend logs ==="
          docker logs geopulse-ui-e2e || true
          echo ""
          echo "=== Database logs ==="
          docker logs geopulse-postgres-e2e || true
          echo ""
          echo "=== Fake Immich/Memos/OIDC logs ==="
          docker logs geopulse-demo-integrations-e2e || true

      - name: Cleanup
        if: always()
        run: docker compose -f "$E2E_COMPOSE_FILE" down -v || echo "Cleanup failed but continuing"

  report:
    name: Merge E2E reports
    runs-on: ubuntu-latest
    needs: e2e
    if: ${{ !cancelled() }}
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.10.0'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: |
          cd tests
          npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          path: tests/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML and JUnit reports
        run: |
          cd tests
          npx playwright merge-reports --reporter=html,junit ./all-blob-reports
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/results.xml

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: ${{ inputs.retention-days }}

      - name: Upload JUnit report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-junit
          path: tests/test-results/results.xml
          retention-days: ${{ inputs.retention-days }}
