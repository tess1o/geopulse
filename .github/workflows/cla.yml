name: CLA Assistant

# Asks every pull request author to accept the Contributor License Agreement
# in CONTRIBUTING.md. Signatures are stored on the cla-signatures branch.
# pull_request_target is safe here: this workflow never checks out PR code.
# Every comment on any issue or PR starts a run; the job-level `if` skips the ones that are not
# a CLA signature or "recheck", so skipped runs in the Actions list are expected.
# No `closed` trigger: it is only needed for lock-pullrequest-aftermerge, which is off.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/tess1o/geopulse/blob/main/CONTRIBUTING.md'
          path-to-signatures: 'signatures/version1/cla.json'
          branch: 'cla-signatures'
          allowlist: 'tess1o,dependabot[bot],github-actions[bot],renovate[bot]'
          lock-pullrequest-aftermerge: false
