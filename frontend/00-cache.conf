proxy_cache_path /var/cache/nginx/osm levels=1:2 keys_zone=osm_cache:10m max_size=1g inactive=30d use_temp_path=off;

# Map to extract subdomain from the request URI
map $request_uri $osm_subdomain {
    ~^/osm/tiles/a/ a;
    ~^/osm/tiles/b/ b;
    ~^/osm/tiles/c/ c;
    default a;
}

log_format geopulse_safe '$request_method $uri $status $body_bytes_sent $request_time';

map "$status:$uri" $geopulse_access_loggable {
    ~^[23] 0;
    ~^[^:]+:/api/v1/registration-invitations/ 0;
    ~^[^:]+:/api/v1/public/share-links/ 0;
    default 1;
}
